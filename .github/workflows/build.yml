name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar la clave de firma privada
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Falta el secreto KEYSTORE_BASE64 (clave de firma). Añádelo en Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KS_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Compilar APK firmado (release)
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: tvvms
          KS_KEY_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk TV-VMS.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TV-VMS-apk
          path: TV-VMS.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TV VMS build ${{ github.run_number }}
          files: TV-VMS.apk
